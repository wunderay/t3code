[package]
name = "t3-coordinator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
